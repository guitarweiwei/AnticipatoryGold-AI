name: Historical performance preparation (no orders)
on:
  push:
    branches: [dev/v1-p0-hardening]
    paths:
      - '.github/workflows/performance-preflight.yml'
      - 'MQL5/Tests/Performance/**'
      - 'scripts/research_data/**'
      - 'config/research/**'
permissions:
  contents: read
jobs:
  compile-importer:
    if: contains(github.event.head_commit.message, '[performance-preflight-authorized]')
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Parse reviewed Windows wrappers
        run: |
          foreach ($file in Get-ChildItem "$env:GITHUB_WORKSPACE/tests/windows" -Filter '*.ps1' -File) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Probe one public historical quote hour without computing returns
        continue-on-error: true
        run: |
          python "$env:GITHUB_WORKSPACE/scripts/research_data/dukascopy_ticks.py" acquire --start 2024-01-15T10:00:00Z --end 2024-01-15T11:00:00Z --workers 1 --retries 0 --timeout 20 --output "$env:RUNNER_TEMP/private-quote-probe"
      - name: Prepare authorized signed official compiler offline
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/cloud_compile.ps1" -RepositoryRoot $env:GITHUB_WORKSPACE -EvidenceDirectory "$env:RUNNER_TEMP/performance-preparation" -AcceptMetaQuotesEula -AllowOfflineTerminalBootstrap -ApprovedInstallerSha256 'C8C0A73F86C58974DF62FB48F8256A099D6698518CF2DEFC2B3F169773729E22' -ApprovedSignerThumbprint '5A64A7AED24C33DED342D01D01FA5286F06DA6DC'
      - name: Compile data importer without deploying or executing it
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/compile.ps1" -MetaEditor "$env:RUNNER_TEMP/AnticipatoryGold-MetaQuotes/metaeditor64.exe" -Source "$env:GITHUB_WORKSPACE/MQL5/Tests/Performance/ImportBidAskTicks.mq5" -SourceTreeRoot "$env:GITHUB_WORKSPACE/MQL5" -IncludeRoot "$env:RUNNER_TEMP/AnticipatoryGold-MetaQuotes/MQL5" -EvidenceDirectory "$env:RUNNER_TEMP/performance-importer-compile"
      - name: Preserve real compilation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: performance-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/private-quote-probe/download-manifest.json
            ${{ runner.temp }}/performance-preparation/preflight-result.json
            ${{ runner.temp }}/performance-preparation/offline-bootstrap/offline-bootstrap-result.json
            ${{ runner.temp }}/performance-preparation/compile/compile-result.json
            ${{ runner.temp }}/performance-preparation/compile/metaeditor.log
            ${{ runner.temp }}/performance-importer-compile/compile-result.json
            ${{ runner.temp }}/performance-importer-compile/source-manifest.json
            ${{ runner.temp }}/performance-importer-compile/metaeditor.log
          if-no-files-found: error
          retention-days: 7
