name: Historical quote reference replay (not MT5 tester)
on:
  push:
    branches: [dev/v1-p0-hardening]
    paths:
      - '.github/workflows/reference-replay.yml'
      - 'tests/windows/reference_indicators.ps1'
      - 'MQL5/Tests/Performance/ExportReferenceIndicators.mq5'
      - 'scripts/research_backtest/**'
      - 'config/research/**'
permissions:
  contents: read
jobs:
  reference-replay:
    if: contains(github.event.head_commit.message, '[reference-replay-authorized]')
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Run data and reference execution fault tests
        run: |
          python -m unittest discover -s scripts/research_data -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Data tests failed.' }
          python -m unittest discover -s scripts/research_backtest -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Reference engine tests failed.' }
          foreach ($file in Get-ChildItem "$env:GITHUB_WORKSPACE/tests/windows" -Filter '*.ps1' -File) {
            $tokens=$null; $parseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Prepare signed official native indicator runtime offline
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/cloud_compile.ps1" -RepositoryRoot $env:GITHUB_WORKSPACE -EvidenceDirectory "$env:RUNNER_TEMP/reference-preparation" -AcceptMetaQuotesEula -AllowOfflineTerminalBootstrap -ApprovedInstallerSha256 'C8C0A73F86C58974DF62FB48F8256A099D6698518CF2DEFC2B3F169773729E22' -ApprovedSignerThumbprint '5A64A7AED24C33DED342D01D01FA5286F06DA6DC'
      - name: Compile reviewed native exporter before historical acquisition
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/compile.ps1" -MetaEditor "$env:RUNNER_TEMP/AnticipatoryGold-MetaQuotes/metaeditor64.exe" -Source "$env:GITHUB_WORKSPACE/MQL5/Tests/Performance/ExportReferenceIndicators.mq5" -SourceTreeRoot "$env:GITHUB_WORKSPACE/MQL5" -IncludeRoot "$env:RUNNER_TEMP/AnticipatoryGold-MetaQuotes/MQL5" -EvidenceDirectory "$env:RUNNER_TEMP/reference-exporter-precompile"
      - name: Acquire frozen warmup and complete 2024 quotes privately
        run: |
          python scripts/research_data/acquire_frozen.py --output "$env:RUNNER_TEMP/private-reference-quotes"
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete or rate-limited acquisition: no returns computed.' }
      - name: Normalize original quotes as explicitly uncalibrated research input
        run: |
          python scripts/research_data/dukascopy_ticks.py normalize --archive "$env:RUNNER_TEMP/private-reference-quotes" --price-divisor 1000 --diagnostic-unvalidated --output "$env:RUNNER_TEMP/AG_REF_ticks.csv" --quality "$env:RUNNER_TEMP/reference-quality.json"
          if ($LASTEXITCODE -notin 0,2) { throw 'Quote normalization failed.' }
          $quality=Get-Content -Raw "$env:RUNNER_TEMP/reference-quality.json" | ConvertFrom-Json
          if ($quality.status -ne 'STRUCTURAL_CHECKS_PASSED' -or $quality.rows -le 0 -or $quality.unclassified_failed_hours.Count -ne 0 -or $quality.expected_hours -ne 10248) { throw 'Incomplete quote coverage: no replay allowed.' }
          # Exit 2 with structural success denotes a deliberately disclosed missing
          # independent scale/timebase calibration, never an authenticated broker run.
          $global:LASTEXITCODE=0
      - name: Derive bid M1 bars without filling missing minutes
        run: |
          python scripts/research_backtest/reference_replay.py prepare-m1 --ticks "$env:RUNNER_TEMP/AG_REF_ticks.csv" --output "$env:RUNNER_TEMP/AG_REF_M1.csv" --metadata "$env:RUNNER_TEMP/reference-m1-metadata.json"
          if ($LASTEXITCODE -ne 0) { throw 'M1 derivation failed.' }
      - name: Export original MT5 indicators offline without orders
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/reference_indicators.ps1" -RepositoryRoot $env:GITHUB_WORKSPACE -InstallationDirectory "$env:RUNNER_TEMP/AnticipatoryGold-MetaQuotes" -M1File "$env:RUNNER_TEMP/AG_REF_M1.csv" -EvidenceDirectory "$env:RUNNER_TEMP/reference-native" -ExplicitUserAuthorization
          $native=Get-Content -Raw "$env:RUNNER_TEMP/reference-native/AG_REF_INDICATORS_RESULT.json" | ConvertFrom-Json
          $m1=Get-Content -Raw "$env:RUNNER_TEMP/reference-m1-metadata.json" | ConvertFrom-Json
          $quality=Get-Content -Raw "$env:RUNNER_TEMP/reference-quality.json" | ConvertFrom-Json
          if ($native.input_sha256 -ne $m1.m1_sha256 -or $native.m1_bars -ne $m1.m1_count -or $m1.source_ticks_sha256 -ne $quality.normalized_sha256 -or $m1.tick_count -ne $quality.rows -or $native.h1_rows -le 500 -or $native.m5_rows -le 500) { throw 'Native and source data binding mismatch.' }
      - name: Execute frozen Python quote scenarios using native indicators
        run: |
          python scripts/research_backtest/reference_replay.py replay --ticks "$env:RUNNER_TEMP/AG_REF_ticks.csv" --m5 "$env:RUNNER_TEMP/reference-native/AG_REF_M5.csv" --h1 "$env:RUNNER_TEMP/reference-native/AG_REF_H1.csv" --quality "$env:RUNNER_TEMP/reference-quality.json" --output "$env:RUNNER_TEMP/reference-results"
          if ($LASTEXITCODE -ne 0) { throw 'Reference replay failed validity checks.' }
          "Result type: native MT5 indicators plus Python quote execution reference. **NOT an MT5 Strategy Tester performance run**. Actual results and limitations are in summary.json." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Preserve metadata and derived study results only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reference-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reference-preparation/preflight-result.json
            ${{ runner.temp }}/reference-preparation/offline-bootstrap/offline-bootstrap-result.json
            ${{ runner.temp }}/reference-preparation/compile/compile-result.json
            ${{ runner.temp }}/reference-exporter-precompile/compile-result.json
            ${{ runner.temp }}/reference-exporter-precompile/source-manifest.json
            ${{ runner.temp }}/reference-exporter-precompile/metaeditor.log
            ${{ runner.temp }}/private-reference-quotes/download-plan.json
            ${{ runner.temp }}/private-reference-quotes/download-manifest.json
            ${{ runner.temp }}/private-reference-quotes/download-manifest-first-pass.json
            ${{ runner.temp }}/reference-quality.json
            ${{ runner.temp }}/reference-m1-metadata.json
            ${{ runner.temp }}/reference-native/native-indicators-run.json
            ${{ runner.temp }}/reference-native/AG_REF_INDICATORS_RESULT.json
            ${{ runner.temp }}/reference-native/indicators.ini
            ${{ runner.temp }}/reference-native/compile/compile-result.json
            ${{ runner.temp }}/reference-native/compile/source-manifest.json
            ${{ runner.temp }}/reference-native/compile/metaeditor.log
            ${{ runner.temp }}/reference-native/logs/*.log
            ${{ runner.temp }}/reference-native/MQL5/Logs/*.log
            ${{ runner.temp }}/reference-results/summary.json
            ${{ runner.temp }}/reference-results/failure.json
            ${{ runner.temp }}/reference-results/*/equity.csv
            ${{ runner.temp }}/reference-results/*/trades.csv
          if-no-files-found: error
          retention-days: 7
