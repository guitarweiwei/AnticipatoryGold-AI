name: Windows MetaEditor evidence (preflight and authorized compile)

on:
  push:
    branches: [dev/v1-p0-hardening]
    paths:
      - '.github/workflows/metaeditor-compile.yml'
      - 'tests/windows/**'
      - 'MQL5/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-signature-only:
    name: Windows download and signature only - compile NOT RUN
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Parse Windows scripts without executing installation
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('tests/windows/cloud_compile.ps1', 'tests/windows/compile.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
            Write-Output "PowerShell syntax valid: $file"
          }
      - name: Download and inspect signed installer - EULA NOT accepted
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/cloud_compile.ps1" -RepositoryRoot $env:GITHUB_WORKSPACE -EvidenceDirectory "$env:RUNNER_TEMP/metaquotes-evidence" -AcceptMetaQuotesEula:$false
          $report = Get-Content -Raw "$env:RUNNER_TEMP/metaquotes-evidence/preflight-result.json" | ConvertFrom-Json
          if ($report.status -ne 'PREFLIGHT ONLY - INSTALLATION NOT AUTHORIZED' -or $report.eula_accepted -or $report.compile -ne 'NOT RUN' -or $report.backtest -ne 'NOT RUN' -or $report.signature_status -ne 'Valid') {
            throw 'Preflight did not satisfy its no-installation evidence contract.'
          }
      - name: Preserve JSON evidence only - never vendor binaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: metaquotes-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metaquotes-evidence/preflight-result.json
          if-no-files-found: error
          retention-days: 7


  authorized-compile:
    name: Authorized MetaEditor compile only - no backtest
    # One-shot activation on a reviewed development commit, not every later push.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[metaeditor-compile-authorized]')
    needs: download-signature-only
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install reviewed official software and compile only
        # User explicitly accepted MetaQuotes EULA on 2026-10-21 in this task.
        # These exact hash/certificate values came from preflight run 39602184477.
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/cloud_compile.ps1" -RepositoryRoot $env:GITHUB_WORKSPACE -EvidenceDirectory "$env:RUNNER_TEMP/metaquotes-compile-evidence" -AcceptMetaQuotesEula -ApprovedInstallerSha256 'C8C0A73F86C58974DF62FB48F8256A099D6698518CF2DEFC2B3F169773729E22' -ApprovedSignerThumbprint '5A64A7AED24C33DED342D01D01FA5286F06DA6DC'
      - name: Preserve actual JSON and compiler log only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: metaeditor-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/metaquotes-compile-evidence/preflight-result.json
            ${{ runner.temp }}/metaquotes-compile-evidence/installation-files.json
            ${{ runner.temp }}/metaquotes-compile-evidence/compile/compile-result.json
            ${{ runner.temp }}/metaquotes-compile-evidence/compile/source-manifest.json
            ${{ runner.temp }}/metaquotes-compile-evidence/compile/standard-library-manifest.json
            ${{ runner.temp }}/metaquotes-compile-evidence/compile/metaeditor.log
          if-no-files-found: error
          retention-days: 7
